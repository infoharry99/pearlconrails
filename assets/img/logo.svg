<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <!-- Train aerodynamic nose / track motif -->
  <g transform="translate(4, 8)">
    <!-- Rail tracks -->
    <line x1="0" y1="44" x2="68" y2="44" stroke="#8DC63F" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="10" y1="48" x2="62" y2="48" stroke="#1E3A5F" stroke-width="1.5" stroke-linecap="square"/>
    <!-- Dynamic high-speed train silhouette -->
    <path d="M4 36 C16 36 28 32 38 24 C48 16 56 12 68 12 L64 22 C56 22 48 26 40 32 C34 36 24 38 4 38 Z" fill="#8DC63F"/>
    <path d="M12 28 C26 28 38 23 48 16 C58 9 66 6 78 6 L72 16 C62 16 54 20 44 26 C36 30 26 32 12 32 Z" fill="#FFFFFF"/>
    <!-- Cab window visor -->
    <polygon points="52,14 62,14 58,19 48,19" fill="#0D1F3C"/>
  </g>
  <!-- Typography -->
  <g transform="translate(86, 12)">
    <!-- PEARLCON -->
    <text x="0" y="24" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">PEARLCON</text>
    <!-- RAIL (Lime accent) -->
    <text x="122" y="24" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#8DC63F">RAIL</text>
    <!-- Subtitle -->
    <text x="1" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="500" letter-spacing="2" fill="#CBD5E0">SERVICES &bull; GLOBAL PROCUREMENT</text>
  </g>
</svg>
