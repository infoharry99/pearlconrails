<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 68" width="380" height="68" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="limeGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9EE046" />
      <stop offset="100%" stop-color="#72B026" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1F3C" />
      <stop offset="100%" stop-color="#162A4A" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon: High-Speed Bullet Train + AI Neural Network Node (54x54) -->
  <g transform="translate(4, 7)">
    <!-- Outer Shield / Container -->
    <rect x="2" y="2" width="52" height="52" rx="13" fill="url(#navyGrad)" stroke="#8DC63F" stroke-width="2"/>
    <line x1="10" y1="17" x2="46" y2="17" stroke="rgba(141, 198, 63, 0.3)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="8" y1="39" x2="48" y2="39" stroke="rgba(141, 198, 63, 0.3)" stroke-width="1.5" stroke-dasharray="2 2"/>
    
    <!-- Train Aerodynamic Front Profile -->
    <path d="M10 36 L22 15 C28 13, 39 13, 45 19 C49 23, 49 29, 45 36 L10 36 Z" fill="url(#limeGrad)"/>
    <path d="M20 19 C26 16, 36 16, 41 21 L38 27 L20 27 Z" fill="#0D1F3C"/>
    
    <!-- Glowing AI Light Node -->
    <circle cx="41" cy="30" r="3.5" fill="#FFFFFF"/>
    <circle cx="41" cy="30" r="5.5" stroke="#9EE046" stroke-width="1.5" fill="none"/>

    <!-- Track & Base Rails -->
    <path d="M6 43 H50" stroke="#8DC63F" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 48 H44" stroke="#0D1F3C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- PEARLCON -->
  <text x="72" y="37" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="25" fill="#0D1F3C" letter-spacing="-0.3">PEARLCON</text>
  
  <!-- RAIL -->
  <text x="228" y="37" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="25" fill="#8DC63F" letter-spacing="-0.3">RAIL</text>

  <!-- Subtitle Tagline -->
  <text x="73" y="53" font-family="'Inter', sans-serif" font-weight="700" font-size="9.5" fill="#475569" letter-spacing="1.8">SERVICES LTD · AI PROCUREMENT</text>
</svg>
